       var out = \"\";\n        for (let i = 0; i &lt; data.length; i++) {\n            out += data[i];\n        }\n        //console.log(out);\n        var out = data;\n        var file = new Blob([out]);\n        var elem = window.document.createElement('a');\n        elem.href = window.URL.createObjectURL(file);\n        elem.download = fileName;\n        document.body.appendChild(elem);\n        elem.click();\n        document.body.removeChild(elem);\n    }\n\nclass bagPattern {\n    constructor(params) {\n    \n        this.params = params;\n        this.readInputs();\n        \n        //this.height = params.height;\n        //this.top_width = params.top_width;\n        //this.bottom_width = params.bottom_width; \n        //this.depth = params.depth;\n        //this.zip_offset = params.zip_offset;\n        //this.zip_reach = params.zip_reach;\n        //this.seam_allowance = params.seam_allowance;\n\n        \n        this.getPatternPoints();\n        this.getSeamAlowancePoints();\n        this.getCanvasSize();\n        this.writeToSvg();\n    }\n    \n    readInputs(){\n        const params = this.params;\n        this.height = params.height_input.value;\n        this.top_width = params.top_width_input.value;\n        this.bottom_width = params.bottom_width_input.value; \n        this.depth = params.depth_input.value;\n        this.zip_offset = params.zip_offset_input.value;\n        this.zip_reach = params.zip_reach_input.value;\n        this.seam_allowance = Number(params.seam_allowance_input.value);\n        \n        console.log(this.height, this.top_width, this.bottom_width);\n        console.log(this.depth, this.zip_offset, this.zip_reach);\n    }\n\n    // find points A -&gt; M without seam allowance\n    getPatternPoints(){\n        const height = this.height;\n        const top_width = this.top_width;\n        const bottom_width = this.bottom_width; \n        const depth = this.depth;\n        const zip_offset = this.zip_offset;\n        const zip_reach = this.zip_reach;\n\n        const d = Math.sqrt(height**2 + (top_width-bottom_width)**2); // distance from bottom corner to top corner\n\n        const points = {'A': [0, depth+height],\n                        'B': [top_width*0.5 + (zip_reach)*0.01*d, depth+height],\n                        'C': [top_width*0.5 + (zip_reach)*0.01*d, depth*0.5+height+ (0.01*zip_offset*0.5*depth)],\n                        'D': [top_width*0.5, depth*0.5+height+ (0.01*zip_offset*0.5*depth)],\n                        'E': [bottom_width*0.5, depth*0.5+ (0.01*zip_offset*0.5*depth)],\n                        'F': [bottom_width*0.5 + (100-zip_reach)*0.01*d, depth*0.5+(0.01*zip_offset*0.5*depth)],\n                        'G': [bottom_width*0.5 + (100-zip_reach)*0.01*d, 0],\n                        'H': [bottom_width*0.5 + (100-zip_reach)*0.01*d, -(0.5*depth - (0.01*zip_offset*0.5*depth))],\n                        'I': [bottom_width*0.5, -(0.5*depth - (0.01*zip_offset*0.5*depth))],\n                        'J': [top_width*0.5, -(0.5*depth - (0.01*zip_offset*0.5*depth)+height)] , \n                        'K': [top_width*0.5 + (zip_reach)*0.01*d, -(0.5*depth - (0.01*zip_offset*0.5*depth)+height)],\n                        'L': [top_width*0.5 + (zip_reach)*0.01*d, -(depth+height)],\n                        'M': [0, -(depth+height)]\n                        };\n        this.points = points;\n        //console.log('points', points);\n    }\n\n    // adds seam allowance to pattern points\n    getSeamAlowancePoints(){\n        console.log('sa',this.seam_allowance);\n        if (this.points === null){return}\n        if (this.seam_allowance == 0 | !this.seam_allowance) return\n        \n        const height = this.height;\n        const top_width = this.top_width;\n        const bottom_width = this.bottom_width; \n        const depth = this.depth;\n        const zip_offset = this.zip_offset;\n        const zip_reach = this.zip_reach;\n        const sa = this.seam_allowance;\n        \n        const d = Math.sqrt(height**2 + (top_width-bottom_width)**2); // distance from bottom corner to top corner\n\n        const points_sa = {'A_sa': [0, depth+height],\n                                'B_sa': [top_width*0.5 + (zip_reach)*0.01*d +sa, depth+height],\n                                'C_sa': [top_width*0.5 + (zip_reach)*0.01*d +sa, depth*0.5+height+ (0.01*zip_offset*0.5*depth) -sa],\n                                'D_sa': [top_width*0.5 +sa, depth*0.5+height+ (0.01*zip_offset*0.5*depth) -sa],\n                                'E_sa': [bottom_width*0.5 +sa, depth*0.5+ (0.01*zip_offset*0.5*depth) +sa],\n                                'F_sa': [bottom_width*0.5 + (100-zip_reach)*0.01*d +sa, depth*0.5+(0.01*zip_offset*0.5*depth)+sa],\n                                'G_sa': [bottom_width*0.5 + (100-zip_reach)*0.01*d +sa, 0],\n                                'H_sa': [bottom_width*0.5 + (100-zip_reach)*0.01*d+sa, -(0.5*depth - (0.01*zip_offset*0.5*depth))-sa],\n                                'I_sa': [bottom_width*0.5+sa, -(0.5*depth - (0.01*zip_offset*0.5*depth))-sa],\n                                'J_sa': [top_width*0.5+sa, -(0.5*depth - (0.01*zip_offset*0.5*depth)+height)+sa] , \n                                'K_sa': [top_width*0.5 + (zip_reach)*0.01*d+sa, -(0.5*depth - (0.01*zip_offset*0.5*depth)+height)+sa],\n                                'L_sa': [top_width*0.5 + (zip_reach)*0.01*d+sa, -(depth+height)],\n                                'M_sa': [0, -(depth+height)]\n                        };\n\n        //console.log(points_sa);\n        this.points_sa = points_sa;\n\n    }\n\n    getCanvasSize(){\n        const canvas_width = 2*Math.max(this.points['B'][0], this.points['F'][0] )+ 2 + this.seam_allowance;\n        const canvas_height = 2*(this.depth+ this.height)+ 2 + this.seam_allowance;\n        this.canvas_size = {canvas_height: canvas_height, canvas_width: canvas_width };\n    }\n\n    ConvertPointstoCanvasCoords(points){\n        var points_canvas = {};\n        const x_offset = this.canvas_size.canvas_width*0.5;\n        const y_offset = this.canvas_size.canvas_height*0.5;\n        const points_names = Object.keys(points); //['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M'];\n        for (var i = 0; i &lt; points_names.length; i++) { \n            const p = points_names[i];\n            points_canvas[p+'x'] = (points[p][0] + x_offset).toFixed(3); \n            points_canvas[p+'y'] = (-points[p][1] + y_offset).toFixed(3); // canvas coordinates have y running down page\n            points_canvas[p+'x_'] = (-points[p][0] + x_offset).toFixed(3); \n        }\n        \n        return points_canvas;\n    }\n\n    writeToSvg(){\n        const template = this.params.template;\n       \n        const a = this.canvas_size;\n        const b = this.ConvertPointstoCanvasCoords(this.points);\n        const c = this.ConvertPointstoCanvasCoords(this.points_sa);\n        var data = Object.assign(a,b,c);\n       \n        console.log(data);\n        const data_to_write = ApplyTemplate(template, data);\n        //console.log(data_to_write);\n\n        const filename = this.params.filename ?? 'pattern____.svg';\n        WriteFile(data_to_write, filename );\n    \n    }\n    \n    \n}\n\nlet count = 0\n\n// the callback function\nexport default (args, obj, data, context) =&gt; {\n    count += 1\n    console.log(`CustomJS was called ${count} times`)\n    const bag = new bagPattern(args.params);\n\n}"}}]]]},"label":"Generate pattern"}}]}}]}}]}}
